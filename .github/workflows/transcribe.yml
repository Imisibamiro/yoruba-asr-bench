name: transcribe
on:
  workflow_dispatch:
    inputs:
      video_id: { description: "YouTube video id (blank if audio_url)", required: false }
      audio_url: { description: "direct audio link (used instead of YouTube)", required: false }
      start: { description: "start hh:mm:ss", required: true }
      end: { description: "end hh:mm:ss", required: true }
      lang: { description: "language code", default: "yor_Latn" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 && nproc && free -g
      - name: Python packages
        run: |
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q fairseq2 --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.8.0/cpu
          pip install -q omnilingual-asr huggingface_hub demucs yt-dlp --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.8.0/cpu
          pip install -q "pyarrow<17" transformers
          pip list 2>/dev/null | grep -i -E "^(torch|fairseq2|numpy|pyarrow)"
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: models-v1
      - name: Download audio section
        id: dl
        continue-on-error: true
        run: |
          start=$(date +%s)
          if [ -n "${{ inputs.audio_url }}" ]; then
            curl -sL "${{ inputs.audio_url }}" -o full.mp3
            ffmpeg -loglevel error -y -ss "${{ inputs.start }}" -to "${{ inputs.end }}" -i full.mp3 clip.mp3
          else
            yt-dlp -f 139/worstaudio --download-sections "*${{ inputs.start }}-${{ inputs.end }}" -o "clip.%(ext)s" "https://www.youtube.com/watch?v=${{ inputs.video_id }}"
          fi
          echo "download took $(( $(date +%s) - start ))s"
      - name: Chunk raw audio (no vocal separation)
        if: steps.dl.outcome == 'success'
        run: |
          mkdir raw
          ffmpeg -loglevel error -i clip.* -ar 16000 -ac 1 -f segment -segment_time 30 raw/c%02d.wav
          ls raw
          mkdir raw10
          ffmpeg -loglevel error -i clip.* -ar 16000 -ac 1 -f segment -segment_time 10 raw10/c%03d.wav
      - name: Transcribe, NCAIR Yoruba (whisper-small, 10 s pieces)
        if: steps.dl.outcome == 'success'
        continue-on-error: true
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python light.py NCAIR1/Yoruba-ASR raw10
      - name: Transcribe, NCAIR Igbo (whisper-small, 10 s pieces)
        if: steps.dl.outcome == 'success'
        continue-on-error: true
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python light.py NCAIR1/Igbo-ASR raw10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript
          path: transcript-*.json
          if-no-files-found: ignore
