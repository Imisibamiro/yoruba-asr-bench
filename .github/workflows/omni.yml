name: omni
on:
  workflow_dispatch:
    inputs:
      tag: { description: "release tag holding clips6.enc", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix: { model: [qwen, gemma] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.53" accelerate librosa soundfile qwen-omni-utils timm
      - name: Fetch and unlock clips
        env: { GH_TOKEN: "${{ github.token }}", CLIP_KEY: "${{ secrets.CLIP_KEY }}" }
        run: |
          gh release download "${{ inputs.tag }}" -p clips6.enc -R "${{ github.repository }}"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CLIP_KEY -in clips6.enc | tar xz 2>/dev/null
          ls p6 | wc -l
      - name: Transcribe
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python omni.py ${{ matrix.model }}
      - name: Lock results
        env: { CLIP_KEY: "${{ secrets.CLIP_KEY }}" }
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CLIP_KEY -in omni-${{ matrix.model }}.json -out omni-${{ matrix.model }}.enc
      - uses: actions/upload-artifact@v4
        with: { name: "omni-${{ matrix.model }}", path: "omni-${{ matrix.model }}.enc", retention-days: 1 }
